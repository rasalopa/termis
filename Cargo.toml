[package]
name = "termis"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Three-pane terminal workspace: current project, a live Claude Code session and git changes"
license = "MIT"
readme = "README.md"
publish = false

[[bin]]
name = "termis"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
nix = { version = "0.28", features = ["signal"] }
portable-pty = "0.9"
ratatui = "0.30"
tui-term = "0.3"
unicode-segmentation = "1"
unicode-width = "0.2"
vt100 = "0.16"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "warn"
